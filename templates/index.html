<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 程式練習助手</title>
    <!-- 關鍵步驟：把 static 資料夾裡的 style.css 連結進來 -->
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

    <h1>AI 程式練習助手</h1>
    <p>這是一個用於練習程式設計的 AI 助手。請在下方輸入您的程式碼，並點擊「執行」按鈕來查看結果。</p>

    <h3>請輸入選擇的學習主題：</h3>
    <div>
        <label><input type="radio" name="topic" value="input_output"> 輸入輸出</label>
        <label><input type="radio" name="topic" value="condition"> 條件判斷</label>
        <label><input type="radio" name="topic" value="loop"> 迴圈</label>
        <label><input type="radio" name="topic" value="list"> 串列</label>
    </div>
    <br>
    <button>幫我出題</button>

    <h3>AI 出題：</h3>
    <p>請選擇一個主題，然後點擊「幫我出題」按鈕，AI 將會為您生成一個練習題目。</p>

    <h3>AI 回饋：</h3>
    <p>請在下方輸入您的程式碼，然後點擊「執行」按鈕，AI 將會為您提供回饋和建議。</p>

</body>
</html>

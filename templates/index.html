<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>AI 程式練習助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>AI 程式練習助手</h1>
    <p>這是一個用於練習程式設計的 AI 助手。請在下方輸入您的程式碼，並點擊「執行」按鈕來查看結果。</p>

    <!-- 選擇主題的表單 -->
    <form method="POST">
        <h2>請輸入選擇的學習主題：</h2>
        <label><input type="radio" name="topic" value="輸入輸出"> 輸入輸出</label>
        <label><input type="radio" name="topic" value="條件判斷"> 條件判斷</label>
        <label><input type="radio" name="topic" value="迴圈"> 迴圈</label>
        <label><input type="radio" name="topic" value="串列"> 串列</label>
        <button type="submit" name="action" value="generate">幫我出題</button>
    </form>

    <h2>AI 出題：</h2>
    <p>{{ question_text }}</p>

    <!-- 檢查答案的表單（帶有隱藏的主題欄位） -->
    <form method="POST">
        <input type="hidden" name="topic" value="{{ topic }}">
        <h2>請輸入您的回答或程式碼：</h2>
        <input type="text" name="student_answer" placeholder="請在此輸入答案">
        <button type="submit" name="action" value="check">送出答案</button>
    </form>

    <h2>AI 回饋：</h2>
    <p>{{ feedback }}</p>

</body>
</html>

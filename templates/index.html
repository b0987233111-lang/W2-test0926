<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>AI 程式練習助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>AI 程式練習助手</h1>
    <p>這是一個用於練習程式設計的 AI 助手。請在下方輸入您的程式碼，並點擊「執行」按鈕來查看結果。</p>

    <!-- 選擇主題的表單 -->
    <form method="POST">
        <h2>請輸入選擇的學習主題：</h2>
        <label><input type="radio" name="topic" value="輸入輸出"> 輸入輸出</label>
        <label><input type="radio" name="topic" value="條件判斷"> 條件判斷</label>
        <label><input type="radio" name="topic" value="迴圈"> 迴圈</label>
        <label><input type="radio" name="topic" value="串列"> 串列</label>
        <button type="submit" class="min-btn" name="action" value="generate">幫我出題</button>
    </form>

    <div class="question_ai">
        <h3>AI 出題：</h3>
        <p>{{ question_text }}</p>

        <!-- 當選擇「輸入輸出」時才顯示作答選項 -->
        {% if topic == "輸入輸出" %}
        <form method="POST">
            <input type="hidden" name="topic" value="{{ topic }}">
            <label><input type="radio" name="student_answer" value="A"> A. input()</label>
            <label><input type="radio" name="student_answer" value="B"> B. print()</label>
            <label><input type="radio" name="student_answer" value="C"> C. len()</label>
            <label><input type="radio" name="student_answer" value="D"> D. range()</label>
            <button type="submit" class="min-btn" name="action" value="check">提交答案</button>
        </form>
        {% endif %}
    </div>

    <!-- 顯示作答回饋 -->
    {% if feedback %}
    <div class="feedback">
        <h3>AI 回饋：</h3>
        <p>{{ feedback }}</p>
    </div>
    {% endif %}

</body>
</html>
